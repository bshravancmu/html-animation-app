<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Animation App</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e100f; font-family: system-ui, sans-serif; }
    .boxes { display: flex; gap: 16px; }
    .box { width: 64px; height: 64px; border-radius: 12px; background: #0ae448; }
  </style>
</head>
<body>
  <div class="boxes">
    <div class="box"></div><div class="box"></div><div class="box"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    const mm = gsap.matchMedia();
    mm.add("(prefers-reduced-motion: no-preference)", () => {
      gsap.from(".box", { y: 60, opacity: 0, rotation: -90, duration: 0.8, ease: "back.out(1.7)", stagger: 0.15 });
    });
  </script>
</body>
</html>
